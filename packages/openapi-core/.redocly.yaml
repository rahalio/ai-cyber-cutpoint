apis:
  identity:
    root: src/identity.yaml
  markets:
    root: src/markets.yaml
  labelling:
    root: src/labelling.yaml
  discovery:
    root: src/discovery.yaml
  interventions:
    root: src/interventions.yaml
  governance:
    root: src/governance.yaml

extends:
  - recommended

rules:
  no-unused-components: off
  operation-4xx-response: warn
  info-license: off
  info-license-url: off
  tag-description: off
  operation-operationId: error
  no-invalid-media-type-examples: off

theme:
  openapi:
    generateCodeSamples:
      languages: []
