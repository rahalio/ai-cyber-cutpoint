openapi: 3.1.0
info:
  title: Shared primitives
  version: 0.1.0
  description: Prefixed IDs and money types shared across domains.
paths: {}
components:
  schemas:
    TenantId:
      type: string
      description: Prefixed ULID-style tenant identifier.
      pattern: '^tnt_[0-9A-HJKMNP-TV-Z]{26}$'
      example: tnt_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    UserId:
      type: string
      description: Prefixed ULID-style tenant operator user identifier.
      pattern: '^usr_[0-9A-HJKMNP-TV-Z]{26}$'
      example: usr_01HZYXK8J0M0W5N6P7Q8R9S0T1U2
    Currency:
      type: string
      description: ISO 4217 currency code.
      minLength: 3
      maxLength: 3
      pattern: '^[A-Z]{3}$'
      example: USD
    Money:
      type: object
      description: Decimal-string amount + currency (never IEEE float).
      required:
        - amount
        - currency
      properties:
        amount:
          type: string
          description: Signed decimal string with up to 5 fractional digits.
          pattern: '^-?\d+(\.\d{1,5})?$'
          example: "1234.56"
        currency:
          $ref: '#/components/schemas/Currency'
    JobStatus:
      type: string
      description: Generic async job lifecycle.
      enum:
        - queued
        - running
        - done
        - failed

    MarketId:
      type: string
      description: Prefixed market identifier.
      pattern: '^mkt_[0-9A-HJKMNP-TV-Z]{26}$'
    CorpusId:
      type: string
      description: Prefixed corpus identifier.
      pattern: '^crp_[0-9A-HJKMNP-TV-Z]{26}$'
    TaxonomyVersionId:
      type: string
      pattern: '^tax_[0-9A-HJKMNP-TV-Z]{26}$'
    BatchId:
      type: string
      pattern: '^bat_[0-9A-HJKMNP-TV-Z]{26}$'
    ClassificationRunId:
      type: string
      pattern: '^run_[0-9A-HJKMNP-TV-Z]{26}$'
    ChainCandidateId:
      type: string
      pattern: '^chn_[0-9A-HJKMNP-TV-Z]{26}$'
    AdjudicationId:
      type: string
      pattern: '^adj_[0-9A-HJKMNP-TV-Z]{26}$'
    DependencyEdgeId:
      type: string
      pattern: '^dep_[0-9A-HJKMNP-TV-Z]{26}$'
    TransactionId:
      type: string
      pattern: '^txn_[0-9A-HJKMNP-TV-Z]{26}$'
    InterventionCandidateId:
      type: string
      pattern: '^icd_[0-9A-HJKMNP-TV-Z]{26}$'
    InterventionId:
      type: string
      pattern: '^int_[0-9A-HJKMNP-TV-Z]{26}$'
    OutcomeMeasurementId:
      type: string
      pattern: '^out_[0-9A-HJKMNP-TV-Z]{26}$'
    PublicationHoldId:
      type: string
      pattern: '^hld_[0-9A-HJKMNP-TV-Z]{26}$'
    EvidencePackageId:
      type: string
      pattern: '^evd_[0-9A-HJKMNP-TV-Z]{26}$'
    PostId:
      type: string
      pattern: '^pst_[0-9A-HJKMNP-TV-Z]{26}$'
    ReplyId:
      type: string
      pattern: '^rpl_[0-9A-HJKMNP-TV-Z]{26}$'
