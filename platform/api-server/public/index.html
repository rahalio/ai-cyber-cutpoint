<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutpoint API Console</title>
  <style>
    :root {
      --bg: #0f1419;
      --panel: #1a2332;
      --text: #e7ecf3;
      --muted: #8b9bb4;
      --accent: #3d9a6a;
      --danger: #c45c5c;
      --border: #2a3548;
      --mono: "IBM Plex Mono", ui-monospace, monospace;
      --sans: "IBM Plex Sans", system-ui, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: var(--sans);
      background: radial-gradient(1200px 600px at 10% -10%, #1c2b22, transparent), var(--bg);
      color: var(--text);
      min-height: 100vh;
    }
    header {
      padding: 1.5rem 1.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }
    header h1 {
      margin: 0;
      font-size: 1.6rem;
      letter-spacing: -0.02em;
    }
    header p { margin: 0.35rem 0 0; color: var(--muted); max-width: 52rem; }
    .toolbar {
      display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: end;
      padding: 1rem 1.75rem; border-bottom: 1px solid var(--border);
      background: color-mix(in srgb, var(--panel) 80%, transparent);
    }
    label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.75rem; color: var(--muted); }
    input, select, button, textarea {
      font: inherit; border-radius: 6px; border: 1px solid var(--border);
      background: var(--bg); color: var(--text); padding: 0.45rem 0.65rem;
    }
    input, select { min-width: 14rem; }
    button {
      background: var(--accent); border-color: transparent; color: #04140c;
      font-weight: 600; cursor: pointer;
    }
    button.secondary { background: transparent; color: var(--text); border-color: var(--border); }
    button:disabled { opacity: 0.5; cursor: wait; }
    main { display: grid; grid-template-columns: 320px 1fr; gap: 0; min-height: calc(100vh - 160px); }
    nav {
      border-right: 1px solid var(--border); padding: 1rem; overflow: auto;
      background: color-mix(in srgb, var(--panel) 55%, transparent);
    }
    nav h2 { margin: 0 0 0.75rem; font-size: 0.8rem; text-transform: uppercase; color: var(--muted); letter-spacing: 0.06em; }
    .ops { display: flex; flex-direction: column; gap: 0.35rem; }
    .ops button {
      text-align: left; background: transparent; color: var(--text); border-color: var(--border);
      font-family: var(--mono); font-size: 0.78rem; font-weight: 500;
    }
    .ops button.active { border-color: var(--accent); color: #9fe0bc; }
    .ops .method { color: var(--accent); margin-right: 0.4rem; }
    section.workspace { padding: 1.25rem 1.5rem; display: flex; flex-direction: column; gap: 0.85rem; }
    pre {
      margin: 0; padding: 1rem; background: #0b1017; border: 1px solid var(--border);
      border-radius: 8px; overflow: auto; font-family: var(--mono); font-size: 0.8rem;
      min-height: 12rem; white-space: pre-wrap; word-break: break-word;
    }
    .status-ok { color: #9fe0bc; }
    .status-bad { color: #f0a0a0; }
    #runAllResults li { margin: 0.25rem 0; font-family: var(--mono); font-size: 0.78rem; }
    @media (max-width: 900px) { main { grid-template-columns: 1fr; } nav { border-right: 0; border-bottom: 1px solid var(--border); max-height: 40vh; } }
  </style>
</head>
<body>
  <header>
    <h1>Cutpoint</h1>
    <p>API console for criminal-market disruption planning. Sandbox mode uses in-memory persistence when Dynamo Local is not configured.</p>
  </header>
  <div class="toolbar">
    <label>Base URL
      <input id="baseUrl" value="" />
    </label>
    <label>X-API-Key
      <input id="apiKey" value="ddd_demo_local_dev_key" />
    </label>
    <button id="runSelected" type="button">Run selected</button>
    <button id="runAll" class="secondary" type="button">Run smoke suite</button>
  </div>
  <main>
    <nav>
      <h2>Operations</h2>
      <div class="ops" id="ops"></div>
    </nav>
    <section class="workspace">
      <label>Path / body
        <textarea id="payload" rows="6"></textarea>
      </label>
      <div id="statusLine" class="status-ok">Ready</div>
      <pre id="output">Select an operation and run it.</pre>
      <ul id="runAllResults" hidden></ul>
    </section>
  </main>
  <script>
    const OPS = [
      { id: 'health', method: 'GET', path: '/health', body: null },
      { id: 'routes', method: 'GET', path: '/routes', body: null },
      { id: 'listKeys', method: 'GET', path: '/v0/tenants/me/api-keys', body: null },
      { id: 'listUsers', method: 'GET', path: '/v0/tenants/me/users', body: null },
      { id: 'listMarkets', method: 'GET', path: '/v1/markets', body: null },
      { id: 'registerMarket', method: 'POST', path: '/v1/markets', body: {
          name: 'Hack Forums Smoke', language: 'en', onboardingLabelBudgetPosts: 8500, driftThresholdF1: 0.35
        }},
      { id: 'listBatches', method: 'GET', path: '/v1/annotation/batches', body: null },
      { id: 'listRuns', method: 'GET', path: '/v1/classification-runs', body: null },
      { id: 'listCandidates', method: 'GET', path: '/v1/chains/candidates', body: null },
      { id: 'listEdges', method: 'GET', path: '/v1/dependencies/edges', body: null },
      { id: 'listInterventions', method: 'GET', path: '/v1/interventions', body: null },
      { id: 'listInterventionCandidates', method: 'GET', path: '/v1/interventions/candidates', body: null },
      { id: 'listHolds', method: 'GET', path: '/v1/assurance/publication-holds', body: null },
    ];

    const baseUrlEl = document.getElementById('baseUrl');
    const apiKeyEl = document.getElementById('apiKey');
    const opsEl = document.getElementById('ops');
    const payloadEl = document.getElementById('payload');
    const outputEl = document.getElementById('output');
    const statusLine = document.getElementById('statusLine');
    const runAllResults = document.getElementById('runAllResults');
    let selected = OPS[0];
    let lastMarketId = null;

    baseUrlEl.value = window.location.origin;

    function renderOps() {
      opsEl.innerHTML = '';
      for (const op of OPS) {
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.dataset.id = op.id;
        btn.innerHTML = `<span class="method">${op.method}</span>${op.path}`;
        if (op.id === selected.id) btn.classList.add('active');
        btn.addEventListener('click', () => {
          selected = op;
          renderOps();
          payloadEl.value = op.body == null
            ? `${op.method} ${op.path}`
            : `${op.method} ${op.path}\n${JSON.stringify(op.body, null, 2)}`;
        });
        opsEl.appendChild(btn);
      }
      payloadEl.value = selected.body == null
        ? `${selected.method} ${selected.path}`
        : `${selected.method} ${selected.path}\n${JSON.stringify(selected.body, null, 2)}`;
    }

    async function call(op, pathOverride) {
      const base = baseUrlEl.value.replace(/\/$/, '');
      const path = pathOverride || op.path;
      const headers = { Accept: 'application/json' };
      const key = apiKeyEl.value.trim();
      if (key) headers['X-API-Key'] = key;
      const init = { method: op.method, headers };
      if (op.body != null && op.method !== 'GET' && op.method !== 'HEAD') {
        headers['Content-Type'] = 'application/json';
        headers['Idempotency-Key'] = crypto.randomUUID();
        init.body = JSON.stringify(op.body);
      }
      const res = await fetch(base + path, init);
      const text = await res.text();
      let json;
      try { json = JSON.parse(text); } catch { json = text; }
      return { status: res.status, ok: res.ok, json };
    }

    async function runSelected() {
      statusLine.textContent = 'Running…';
      statusLine.className = '';
      try {
        const result = await call(selected);
        if (selected.id === 'registerMarket' && result.json?.data?.marketId) {
          lastMarketId = result.json.data.marketId;
        }
        statusLine.textContent = `${result.status} ${result.ok ? 'OK' : 'ERROR'}`;
        statusLine.className = result.ok ? 'status-ok' : 'status-bad';
        outputEl.textContent = typeof result.json === 'string'
          ? result.json
          : JSON.stringify(result.json, null, 2);
        return result;
      } catch (err) {
        statusLine.textContent = 'Request failed';
        statusLine.className = 'status-bad';
        outputEl.textContent = String(err);
        return { ok: false, status: 0, json: String(err) };
      }
    }

    async function runSmoke() {
      runAllResults.hidden = false;
      runAllResults.innerHTML = '';
      const suite = [
        OPS.find(o => o.id === 'health'),
        OPS.find(o => o.id === 'listKeys'),
        OPS.find(o => o.id === 'listUsers'),
        OPS.find(o => o.id === 'listMarkets'),
        OPS.find(o => o.id === 'registerMarket'),
        OPS.find(o => o.id === 'listBatches'),
        OPS.find(o => o.id === 'listCandidates'),
        OPS.find(o => o.id === 'listEdges'),
        OPS.find(o => o.id === 'listInterventions'),
        OPS.find(o => o.id === 'listInterventionCandidates'),
        OPS.find(o => o.id === 'listHolds'),
      ];
      let passed = 0;
      for (const op of suite) {
        selected = op;
        renderOps();
        const result = await runSelected();
        const li = document.createElement('li');
        const ok = result.ok || (result.status >= 200 && result.status < 300);
        if (ok) passed += 1;
        li.textContent = `${ok ? 'PASS' : 'FAIL'} ${result.status} ${op.method} ${op.path}`;
        li.style.color = ok ? '#9fe0bc' : '#f0a0a0';
        runAllResults.appendChild(li);
        if (op.id === 'registerMarket' && result.json?.data?.marketId) {
          lastMarketId = result.json.data.marketId;
          const followUps = [
            { id: 'getMarket', method: 'GET', path: `/v1/markets/${lastMarketId}`, body: null },
            { id: 'getTaxonomy', method: 'GET', path: `/v1/markets/${lastMarketId}/taxonomy`, body: null },
            { id: 'getMap', method: 'GET', path: `/v1/markets/${lastMarketId}/dependency-map`, body: null },
            { id: 'getCoverage', method: 'GET', path: `/v1/assurance/markets/${lastMarketId}/coverage`, body: null },
            { id: 'getDrift', method: 'GET', path: `/v1/assurance/markets/${lastMarketId}/drift`, body: null },
          ];
          for (const f of followUps) {
            const fr = await call(f);
            const fOk = fr.ok;
            if (fOk) passed += 1;
            const fli = document.createElement('li');
            fli.textContent = `${fOk ? 'PASS' : 'FAIL'} ${fr.status} ${f.method} ${f.path}`;
            fli.style.color = fOk ? '#9fe0bc' : '#f0a0a0';
            runAllResults.appendChild(fli);
          }
        }
      }
      statusLine.textContent = `Smoke finished: ${passed} passed`;
      statusLine.className = 'status-ok';
      outputEl.textContent = `Smoke suite complete. lastMarketId=${lastMarketId || 'n/a'}`;
    }

    document.getElementById('runSelected').addEventListener('click', runSelected);
    document.getElementById('runAll').addEventListener('click', runSmoke);
    renderOps();
  </script>
</body>
</html>
